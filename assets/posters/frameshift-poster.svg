<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518" />
      <stop offset="50%" stop-color="#2a0845" />
      <stop offset="100%" stop-color="#ff4500" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Grid Lines -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Geometric Frameshift Badges -->
  <rect x="60" y="50" width="160" height="34" rx="17" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
  <text x="140" y="72" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#ff7700" text-anchor="middle" letter-spacing="1">MITS GWALIOR</text>

  <!-- Main Bold Typography -->
  <text x="60" y="190" font-family="Arial Black, Impact, sans-serif" font-size="78" font-weight="900" fill="#ffffff" letter-spacing="-2">FRAME</text>
  <text x="60" y="270" font-family="Arial Black, Impact, sans-serif" font-size="78" font-weight="900" fill="#ff5500" filter="url(#glow)" letter-spacing="-2">SHIFT.</text>

  <text x="65" y="320" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">CREATIVE ANIMATION &amp; MEME CHALLENGE</text>
  <text x="65" y="350" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">2D / 3D Animation • Kinetic Typography • Viral Meme Cuts • VFX</text>

  <!-- Dynamic Creative Visual Shapes on Right -->
  <g transform="translate(560, 240)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#7928CA" stroke-width="4" stroke-dasharray="12,12"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#FF5500" stroke-width="2"/>
    <polygon points="-50,-60 60,0 -50,60" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="90" cy="-70" r="14" fill="#00f0ff"/>
    <rect x="-110" y="50" width="24" height="24" rx="6" fill="#ff007f"/>
  </g>

  <!-- Footer Tagline -->
  <rect x="0" y="440" width="800" height="60" fill="rgba(0,0,0,0.6)"/>
  <text x="60" y="475" font-family="'Courier New', monospace" font-size="13" fill="#94a3b8">ANNUAL FLAGSHIP SHOWDOWN • ANIMATION CLUB MITS GWALIOR</text>
</svg>

